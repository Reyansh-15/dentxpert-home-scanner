name: Publish DentXpert public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release-blocking static tests
        run: |
          python tests/site_smoke.py
          python -m unittest discover -s tests -p 'test_website2.py' -v
      - name: Install Chromium for release-blocking browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run release-blocking interactive browser tests
        run: python tests/browser_website2.py
      - name: Assemble allowlisted public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/website2
          cp index.html public/
          cp scanner-hero-display.webp public/
          for page in home explore learn discover command-center technology pricing faq about; do
            cp "website2/${page}.html" public/website2/
          done
          cp website2/site.css website2/site.js website2/interactions.css website2/auth.js website2/insforge-config.js website2/knowledge-api.js website2/module-registry.js website2/command-center.js public/website2/
          test "$(find public/website2 -maxdepth 1 -name '*.html' | wc -l)" -eq 9
          ! find public -type f | grep -Ei '\.(mp4|mov|webm|vtt|pdf|md)$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public routes and assets after deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://reyansh-15.github.io/dentxpert-home-scanner"
          for path in / /website2/home.html /website2/explore.html /website2/learn.html /website2/discover.html /website2/command-center.html /website2/technology.html /website2/pricing.html /website2/faq.html /website2/about.html /website2/site.css /website2/site.js /website2/interactions.css /scanner-hero-display.webp; do
            echo "Checking ${base}${path}"
            curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors --silent --show-error --output /dev/null "${base}${path}"
          done
          for path in /TASKS_141_155.md /RELEASE_ROLLBACK.md /website2/secret.mp4; do
            status="$(curl --location --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --output /dev/null --write-out '%{http_code}' "${base}${path}")"
            if [ "$status" = "200" ]; then
              echo "Restricted file is publicly accessible: ${path}"
              exit 1
            elif [ "$status" != "404" ]; then
              echo "Restricted-file verification inconclusive: ${path} (HTTP ${status})"
              exit 1
            fi
          done
